{% extends "base.html" %}
{% block contenido %}
<h1 class="titulo">Pagos y cuotas</h1>

<div class="row g-3">
  <div class="col-lg-4">
    <form class="card card-body" method="post">
      <h3 class="h6">Registrar pago</h3>
      <label class="form-label">Miembro *</label>
      <select class="form-select mb-2" name="id_miembro" required>
        <option value="">Selecciona...</option>
        {% for m in miembros %}<option value="{{ m.id_miembro }}">{{ m.nombre }}</option>{% endfor %}
      </select>
      <label class="form-label">Concepto *</label>
      <input class="form-control mb-2" name="concepto" required value="Cuota semestral {{ semestre }}">
      <div class="row g-2">
        <div class="col-6">
          <label class="form-label">Monto *</label>
          <input class="form-control mb-2" type="number" step="0.01" min="1" name="monto" required value="300">
        </div>
        <div class="col-6">
          <label class="form-label">Fecha *</label>
          <input class="form-control mb-2" type="date" name="fecha_pago" required value="{{ hoy|iso }}">
        </div>
      </div>
      <label class="form-label">Método *</label>
      <select class="form-select mb-3" name="metodo">
        <option value="EFECTIVO">Efectivo</option>
        <option value="TRANSFERENCIA">Transferencia</option>
        <option value="TARJETA">Tarjeta</option>
      </select>
      <button class="btn btn-club">Registrar pago</button>
    </form>
  </div>

  <div class="col-lg-8">
    <div class="card">
      <div class="card-header d-flex justify-content-between">
        <span>{{ pagos|length }} pagos</span><span>Total: {{ total|dinero }}</span>
      </div>
      <div class="table-responsive">
        <table class="table">
          <thead><tr><th>Fecha</th><th>Miembro</th><th>Concepto</th><th class="text-end">Monto</th></tr></thead>
          <tbody>
          {% for p in pagos %}
            <tr>
              <td class="text-nowrap">{{ p.fecha_pago|fecha }}</td>
              <td>{{ p.miembro }}</td>
              <td>{{ p.concepto }}</td>
              <td class="text-end">{{ p.monto|dinero }}</td>
            </tr>
          {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
